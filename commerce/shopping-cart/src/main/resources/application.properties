server.port=8082

spring.application.name=shopping-cart

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

feign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.warehouseClient.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.warehouseClient.slidingWindowSize=5
resilience4j.circuitbreaker.instances.warehouseClient.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.warehouseClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.warehouseClient.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.warehouseClient.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.warehouseClient.automaticTransitionFromOpenToHalfOpenEnabled=true