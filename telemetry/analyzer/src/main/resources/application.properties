spring.datasource.url=jdbc:postgresql://postgres:5432/smarthome
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driverClassName=org.postgresql.Driver

analyzer.topic.snapshots-topic=telemetry.snapshots.v1
analyzer.topic.hub-events=telemetry.hubs.v1

spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.properties.schema.registry.url=http://schema-registry:8089

spring.kafka.consumer.hub.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.hub.value-deserializer=ru.yandex.practicum.kafka.deserializer.HubEventDeserializer
spring.kafka.consumer.hub.group-id=analyzer-hub-group
spring.kafka.consumer.hub.client-id=analyzer-hub-client
spring.kafka.consumer.hub.auto-offset-reset=earliest
spring.kafka.consumer.hub.enable-auto-commit=false

spring.kafka.consumer.snapshots.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.snapshots.value-deserializer=ru.yandex.practicum.kafka.deserializer.SnapshotDeserializer
spring.kafka.consumer.snapshots.group-id=analyzer-snapshot-group
spring.kafka.consumer.snapshots.client-id=analyzer-snapshot-client
spring.kafka.consumer.snapshots.auto-offset-reset=earliest
spring.kafka.consumer.snapshots.enable-auto-commit=false

grpc.client.hub-router.address=static://hub-router:59090
grpc.client.hub-router.negotiationType=plaintext
grpc.client.hub-router.enableKeepAlive=true
grpc.client.hub-router.keepAliveWithoutCalls=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.jpa.show_sql=false

logging.level.ru.yandex.practicum=DEBUG

spring.cloud.config.enabled=true
spring.config.import=optional:configserver: